events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate Limiting: IP başına saniyede 10 isteğe izin ver (DoS/Bot Koruması)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 1. HTTP (Port 80): Tüm düz metin trafiği HTTPS'e (Port 443) yönlendirir
    server {
        listen 80;
        server_name localhost;

        # Sertifika yenileme isteği (Certbot / Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Diğer tüm HTTP isteklerini güvenli HTTPS protokolüne yönlendir
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS (Port 443): Şifreli Güvenli Trafik
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Sertifika Yolları (Certbot / Custom SSL)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Güvenli TLS Yapılandırması (Zayıf şifrelemeleri engeller)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Güvenlik Header'ları (Clickjacking, XSS, Sniffing ve HSTS Koruması)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Statik Arayüz Dosyaları (Nginx Doğrudan Sunar)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # /api/ İstekleri için Rate Limiting & Node.js Proxy Tüneli
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay; # DoS Koruması Kapıda Devrede

            proxy_pass http://node-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}