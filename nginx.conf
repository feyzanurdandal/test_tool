events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    keepalive_timeout 65;

    # Aşırı istek 503 yerine anlamlı 429 olarak döner
    limit_req_status 429;

    # Sıkıştırma: arayüz dosyaları (js/css/json) küçülür; 20+ kullanıcıda bant genişliği tasarrufu sağlar
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── İSTEK SINIRLARI ───
    # eduroam/üniversite NAT'ı arkasında çok sayıda kullanıcı TEK IP görünebilir; bu yüzden
    # IP başına katı sınır YOKTUR. Kimlik doğrulamalı kullanıcılar oturum çerezine göre ayrı
    # kovaya düşer (herkes kendi kotasını kullanır). Çerezsiz istekler IP'ye göre sayılır.
    # Asıl kullanıcı/hesap bazlı sınırlar (login, AI, test çalıştırma) uygulamanın içindedir.
    map $cookie_tt_session $limit_user_key {
        default $cookie_tt_session;
        ""      $binary_remote_addr;
    }
    limit_req_zone $limit_user_key       zone=api_user:20m rate=20r/s;
    limit_req_zone $binary_remote_addr   zone=api_ip:10m   rate=300r/s;

    # 1. HTTP (Port 80): Tüm düz metin trafiği HTTPS'e (Port 443) yönlendirir
    server {
        listen 80;
        server_name localhost;

        # Sertifika yenileme isteği (Certbot / Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Diğer tüm HTTP isteklerini güvenli HTTPS protokolüne yönlendir
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS (Port 443): Şifreli Güvenli Trafik
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Sertifika Yolları (Certbot / Custom SSL)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Güvenli TLS Yapılandırması (Zayıf şifrelemeleri engeller)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Güvenlik Header'ları (Clickjacking, XSS, Sniffing ve HSTS Koruması)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always; # eski tarayıcı filtresi kapatıldı; koruma CSP ile sağlanır
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Arayüz de Node üzerinden sunulur; böylece helmet'in CSP ve güvenlik
        # başlıkları sayfanın kendisine de uygulanır.
        location / {
            proxy_pass http://node-backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/ İstekleri için Rate Limiting & Node.js Proxy Tüneli
        # Testler kuyrukta koştuğu için çoğu istek kısadır. Yapay zeka çevirisi (senaryo kaydetme)
        # sırada bekleyebildiği ve birkaç AI çağrısı yaptığı için okuma zaman aşımı uzundur.
        location /api/ {
            limit_req zone=api_user burst=60 nodelay;
            limit_req zone=api_ip   burst=600 nodelay;
            client_max_body_size 2m;

            proxy_pass http://node-backend:3000;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
