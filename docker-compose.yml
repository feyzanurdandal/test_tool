services:
  # 1. SERVİS: Node.js + Playwright API Sunucusu
  node-backend:
    build: .
    container_name: test_tool_backend
    restart: always
    environment:
      - PORT=3000
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - HEADLESS=true
    volumes:
      - ./cache:/app/cache # Test adımları ve runtime_steps.json için kalıcı bellek
      - ./data:/app/data # SQLite veritabanını makineye bağlıyoruz
    ports:
      - "3000:3000"

  # 2. SERVİS: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: test_tool_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html # Statik Arayüz dosyalarını Nginx'e bağlıyoruz
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Nginx ayar dosyamızı bağlıyoruz
    depends_on:
      - node-backend