services:
  # 1. SERVİS: Node.js + Playwright API Sunucusu
  node-backend:
    build: .
    container_name: test_tool_backend
    restart: always
    init: true
    command: ["sh", "-c", "mkdir -p /tmp/chromium-config /tmp/chromium-cache && exec node server.js"]
    # Kaynaklar .env ile ayarlanır. Her eşzamanlı test ≈ 0,7-1 GB RAM ve ≈ 0,5-1 çekirdek kullanır;
    # varsayılanlar küçük bir sunucu için bilinçli olarak düşüktür (RUN_CONCURRENCY=2 → 3 GB / 2 CPU).
    # Daha büyük sunucuda RUN_CONCURRENCY ile birlikte APP_MEM_LIMIT ve APP_CPUS değerlerini artırın
    # (kural: APP_MEM_LIMIT ≈ 1 GB + RUN_CONCURRENCY × 1 GB).
    mem_limit: ${APP_MEM_LIMIT:-3g}
    cpus: ${APP_CPUS:-2.0}
    pids_limit: 768
    # Chromium paylaşımlı belleği: Docker varsayılanı 64 MB'tır ve ağır sayfalarda tarayıcıyı çökertir.
    shm_size: ${SHM_SIZE:-1gb}
    read_only: true
    stop_grace_period: 120s            # çalışan testlere kapanmadan bitmeleri için süre tanır
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /app/runtime:rw,nosuid,nodev,noexec,size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Yalnızca süreç ayakta mı (DPU'ya bağımlı değil); DPU kesintisi konteyneri yeniden başlatmasın.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_ENV=true
      - DPU_BASE_URL=${DPU_BASE_URL}
      - DPU_PROJECT_CODE=${DPU_PROJECT_CODE}
      - DPU_API_KEY=${DPU_API_KEY}
      - DPU_USER_EMAIL=${DPU_USER_EMAIL}
      - DPU_USER_PASSWORD=${DPU_USER_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Kapasite ve adalet
      - RUN_CONCURRENCY=${RUN_CONCURRENCY:-2}
      - MAX_QUEUED_RUNS=${MAX_QUEUED_RUNS:-200}
      - MAX_QUEUED_PER_USER=${MAX_QUEUED_PER_USER:-50}
      - RECORD_MAX=${RECORD_MAX:-2}
      - AI_CONCURRENCY=${AI_CONCURRENCY:-3}
      - AI_TRANSLATE_RPM=${AI_TRANSLATE_RPM:-20}
      - AI_QUEUE_WAIT_MS=${AI_QUEUE_WAIT_MS:-40000}
      - SHUTDOWN_GRACE_SECONDS=${SHUTDOWN_GRACE_SECONDS:-90}
      - SELECTOR_CACHE=${SELECTOR_CACHE:-on}
      - RUN_TIMEOUT_SECONDS=${RUN_TIMEOUT_SECONDS:-}
      - AI_CALL_TIMEOUT_SECONDS=${AI_CALL_TIMEOUT_SECONDS:-25}
      - LOGIN_MAX_FAILS_PER_USER=${LOGIN_MAX_FAILS_PER_USER:-8}
      - LOGIN_MAX_PER_IP=${LOGIN_MAX_PER_IP:-300}
      # Test hedefleri: asıl liste yönetici panelindedir (Ayarlar > Test İzinli Adresler).
      # Bu iki değişken yalnızca EK olarak listeye eklenir (isteğe bağlı).
      - ALLOWED_PRIVATE_HOSTS=${ALLOWED_PRIVATE_HOSTS:-}
      - ALLOWED_TEST_HOSTS=${ALLOWED_TEST_HOSTS:-}
      - ALLOWED_TEST_PORTS=${ALLOWED_TEST_PORTS:-80,443}
      - SESSION_DIR=/app/sessions
      - RUN_DATA_DIR=/app/run-data
      - HEADLESS=true
      - XDG_CONFIG_HOME=/tmp/chromium-config
      - XDG_CACHE_HOME=/tmp/chromium-cache
    volumes:
      - test-cache:/app/cache
      - test-sessions:/app/sessions
      - test-run-data:/app/run-data
    # Port dışarıya AÇILMAZ: yalnızca nginx, compose ağı üzerinden erişir.
    # Aksi halde nginx atlanıp X-Forwarded-For sahte gönderilerek rate limit aşılabiliyordu.
    expose:
      - "3000"

  # 2. SERVİS: Nginx Reverse Proxy (tek dış giriş noktası)
  nginx:
    image: nginx:alpine
    container_name: test_tool_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      node-backend:
        condition: service_healthy

volumes:
  test-cache:
  test-sessions:
  test-run-data:
