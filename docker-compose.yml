services:
  # 1. SERVİS: Node.js + Playwright API Sunucusu
  node-backend:
    build: .
    container_name: test_tool_backend
    restart: always
    init: true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
      - /app/runtime:rw,nosuid,nodev,noexec,size=16m,mode=1777
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_ENV=true
      - DPU_BASE_URL=${DPU_BASE_URL}
      - DPU_PROJECT_CODE=${DPU_PROJECT_CODE}
      - DPU_API_KEY=${DPU_API_KEY}
      - DPU_USER_EMAIL=${DPU_USER_EMAIL}
      - DPU_USER_PASSWORD=${DPU_USER_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RUN_CONCURRENCY=${RUN_CONCURRENCY:-1}
      - MAX_QUEUED_RUNS=${MAX_QUEUED_RUNS:-50}
      - ALLOWED_PRIVATE_HOSTS=${ALLOWED_PRIVATE_HOSTS:-}
      - ALLOWED_TEST_HOSTS=${ALLOWED_TEST_HOSTS:-}
      - ALLOWED_TEST_PORTS=${ALLOWED_TEST_PORTS:-80,443}
      - SESSION_DIR=/app/sessions
      - HEADLESS=true
    volumes:
      - test-cache:/app/cache
      - test-sessions:/app/sessions
    # Port dışarıya AÇILMAZ: yalnızca nginx, compose ağı üzerinden erişir.
    # Aksi halde nginx atlanıp X-Forwarded-For sahte gönderilerek rate limit aşılabiliyordu.
    expose:
      - "3000"

  # 2. SERVİS: Nginx Reverse Proxy (tek dış giriş noktası)
  nginx:
    image: nginx:alpine
    container_name: test_tool_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot
    depends_on:
      - node-backend

volumes:
  test-cache:
  test-sessions:
